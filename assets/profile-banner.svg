<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sahil Deore — Applied AI and Full-Stack Engineering</title>
  <desc id="desc">Dark navy developer banner with electric-blue gradients, abstract network nodes, and a terminal motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#080d18"/>
      <stop offset="1" stop-color="#10102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".26"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#93c5fd" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="960" cy="150" rx="300" ry="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" fill="none" stroke="#334155" stroke-opacity=".7"/>
  <rect x="42" y="39" width="5" height="62" rx="2.5" fill="url(#accent)"/>
  <text x="68" y="60" fill="#94a3b8" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="3">HELLO, WORLD</text>
  <text x="64" y="122" fill="#f8fafc" font-size="54" font-weight="700" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">Sahil <tspan fill="#60a5fa">Deore</tspan></text>
  <text x="67" y="158" fill="#cbd5e1" font-size="17" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Applied AI  /  LLM Applications  /  Full-Stack Engineering</text>
  <text x="67" y="200" fill="#94a3b8" font-size="15" font-family="Inter, ui-sans-serif, system-ui, sans-serif">Turning model integrations and good engineering into useful products.</text>
  <g transform="translate(68 232)">
    <rect width="132" height="34" rx="17" fill="#0b1d33" stroke="#2563eb" stroke-opacity=".8"/>
    <circle cx="17" cy="17" r="4" fill="#38bdf8"/>
    <text x="30" y="22" fill="#dbeafe" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BUILD</text>
    <rect x="143" width="132" height="34" rx="17" fill="#0b1d33" stroke="#334155"/>
    <circle cx="160" cy="17" r="4" fill="#818cf8"/>
    <text x="173" y="22" fill="#dbeafe" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LEARN</text>
    <rect x="286" width="132" height="34" rx="17" fill="#0b1d33" stroke="#334155"/>
    <circle cx="303" cy="17" r="4" fill="#a78bfa"/>
    <text x="316" y="22" fill="#dbeafe" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ITERATE</text>
  </g>
  <g stroke="url(#accent)" stroke-width="1.35" stroke-opacity=".7" fill="none">
    <path d="M790 56 L872 96 L953 54 L1042 100 L1115 62"/>
    <path d="M872 96 L849 176 L946 218 L1042 100 L1088 189 L1152 224"/>
    <path d="M849 176 L773 220 L946 218 L1088 189"/>
    <path d="M953 54 L946 218"/>
    <path d="M1115 62 L1152 224"/>
  </g>
  <g fill="#0b1728" stroke="#60a5fa" stroke-width="1.5">
    <circle cx="790" cy="56" r="5"/><circle cx="872" cy="96" r="6"/><circle cx="953" cy="54" r="5"/>
    <circle cx="1042" cy="100" r="7"/><circle cx="1115" cy="62" r="5"/><circle cx="849" cy="176" r="5"/>
    <circle cx="946" cy="218" r="7"/><circle cx="1088" cy="189" r="5"/><circle cx="1152" cy="224" r="6"/><circle cx="773" cy="220" r="4"/>
  </g>
  <g transform="translate(830 118)">
    <rect x="0" y="0" width="310" height="80" rx="12" fill="#050b15" fill-opacity=".88" stroke="#334155"/>
    <path d="M0 28 H310" stroke="#334155"/>
    <circle cx="17" cy="14" r="3.5" fill="#fb7185"/><circle cx="30" cy="14" r="3.5" fill="#fbbf24"/><circle cx="43" cy="14" r="3.5" fill="#34d399"/>
    <text x="17" y="48" fill="#7dd3fc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">$ build --ship --learn</text>
    <text x="17" y="66" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">status: always_iterating</text>
  </g>
</svg>